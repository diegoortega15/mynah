<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mynah.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1220" />
    <meta name="description" content="Mynah — app local de imersão em inglês, plano de 90 dias." />
    <title>Mynah — fale como um nativo</title>
    <script>
      // Apply the saved theme BEFORE first paint (no flash). Mirror of src/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem('mynah.theme');
          var light =
            pref === 'light' ||
            (pref !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) {
            document.documentElement.dataset.theme = 'light';
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#f3f4fa');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
